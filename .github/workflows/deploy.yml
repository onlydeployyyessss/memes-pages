name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            id: 13195bc6-b9dd-4792-a47c-042d47a26fce
          - service: worker
            id: 2d2ec68d-535d-4661-81ff-f12de6dd9bb2
          - service: dashboard
            id: a7161797-40ab-4152-9f15-2b5a3be8f65b
    steps:
      - name: Trigger Railway deploy (${{ matrix.service }})
        run: |
          curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: memes-pages-ci/1.0" \
            -d "{\"query\":\"mutation { serviceInstanceDeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"${{ matrix.id }}\\\", latestCommit: true) }\"}" \
            | tee /dev/stderr | grep -q '"serviceInstanceDeploy":true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: bb13c36d-1f07-46a0-b7f4-0415d6c10fd4
